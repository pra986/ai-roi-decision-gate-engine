[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-roi-decision-gate-engine"
version = "0.1.0"
description = "Quantitative AI pilot ROI and stage-gate governance engine accounting for baseline unit cost, API spend, human review overhead, and absent-info evals."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
